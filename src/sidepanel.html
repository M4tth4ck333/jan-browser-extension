<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jan Summarizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="title">Jan Summarizer</div>
    <nav>
      <button id="open-options" title="Settings">⚙️</button>
      <button id="refresh" title="Refresh page content">↻</button>
    </nav>
  </header>

  <section id="source-info"></section>

  <section id="controls">
    <button id="summarize">Summarize Page</button>
    <button id="summarize-selection">Summarize Selection</button>
  </section>

  <section id="status" class="muted"></section>

  <section id="result">
    <pre id="summary-output"></pre>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
