<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jan Summarizer Settings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="options">
  <header><div class="title">Jan Summarizer – Settings</div></header>
  <main>
    <div class="field">
      <label>Provider Preset</label>
      <select id="provider">
        <option value="custom">Custom</option>
        <option value="cerebras">Cerebras (OpenAI-compatible)</option>
        <option value="jan">Jan Server (Local)</option>
      </select>
    </div>

    <div class="field">
      <label>API Base URL</label>
      <input id="apiBase" placeholder="https://api.cerebras.ai/v1 or http://localhost:1337/v1" />
    </div>

    <div class="field">
      <label>API Key</label>
      <input id="apiKey" placeholder="sk-..." />
    </div>

    <div class="field">
      <label>Model</label>
      <input id="model" placeholder="e.g. llama3.1-8b, gpt-4o-mini, cerebras-gpt, etc." />
    </div>

    <div class="field">
      <label>Temperature</label>
      <input id="temperature" type="number" step="0.1" min="0" max="2" />
    </div>

    <div class="buttons">
      <button id="save">Save</button>
      <button id="test">Test</button>
      <span id="status" class="muted"></span>
    </div>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
