<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jan Browser MCP</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 280px;
        min-height: 180px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--popup-bg, transparent);
      }

      h1 {
        font-size: 16px;
        margin: 0;
      }

      .status {
        padding: 12px;
        border-radius: 8px;
        background: rgba(148, 163, 184, 0.12);
        font-size: 13px;
        line-height: 1.4;
      }

      .status strong {
        display: block;
        font-size: 12px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        margin-bottom: 4px;
        color: rgba(71, 85, 105, 0.9);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      button {
        appearance: none;
        border: 1px solid rgba(148, 163, 184, 0.45);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        background: rgba(226, 232, 240, 0.45);
        color: inherit;
        cursor: pointer;
        transition: background 0.18s ease, border-color 0.18s ease;
      }

      button:hover:enabled {
        background: rgba(148, 163, 184, 0.24);
        border-color: rgba(100, 116, 139, 0.6);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .hint {
        font-size: 12px;
        color: rgba(100, 116, 139, 0.9);
      }
    </style>
  </head>
  <body>
    <h1>Browser MCP Tabs</h1>
    <section class="status" id="status">
      <strong>Status</strong>
      <div>Loading tab details…</div>
    </section>
    <div class="actions">
      <button id="activateBtn" type="button">Set current tab as active for MCP</button>
      <button id="gotoBtn" type="button">Go to MCP tab</button>
      <button id="clearBtn" type="button">Clear MCP tab</button>
    </div>
    <p class="hint" id="hint"></p>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
