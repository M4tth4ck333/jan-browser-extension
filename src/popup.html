<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jan Browser MCP</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 300px;
        min-height: 200px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(15, 23, 42, 0.02);
      }

      h1 {
        font-size: 16px;
        margin: 0;
      }

      .popup-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .card {
        padding: 12px;
        border-radius: 10px;
        background: rgba(148, 163, 184, 0.12);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
      }

      .status-spinner {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 2px solid rgba(148, 163, 184, 0.4);
        border-top-color: rgba(59, 130, 246, 0.85);
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .status-error {
        font-size: 12px;
        color: #b91c1c;
        min-height: 16px;
      }

      .tab-status {
        font-size: 13px;
      }

      .tab-message {
        font-size: 12px;
        color: rgba(71, 85, 105, 0.9);
        min-height: 16px;
      }

      .tab-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        appearance: none;
        border: 1px solid rgba(148, 163, 184, 0.4);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        background: rgba(226, 232, 240, 0.5);
        color: inherit;
        cursor: pointer;
        transition: background 0.18s ease, border-color 0.18s ease;
      }

      button:hover:enabled {
        background: rgba(148, 163, 184, 0.24);
        border-color: rgba(100, 116, 139, 0.6);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .primary-button {
        background: rgba(59, 130, 246, 0.2);
        border-color: rgba(59, 130, 246, 0.4);
      }

      .primary-button:hover:enabled {
        background: rgba(59, 130, 246, 0.28);
        border-color: rgba(59, 130, 246, 0.55);
      }

      .icon-button {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-size: 18px;
        line-height: 1;
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.4);
      }

      .icon-button:hover {
        background: rgba(148, 163, 184, 0.2);
      }

      .settings-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.32);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        backdrop-filter: blur(2px);
      }

      .settings-overlay[hidden] {
        display: none !important;
      }

      .settings-modal {
        width: 100%;
        max-width: 260px;
        background: rgba(241, 245, 249, 0.96);
        color: #0f172a;
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
      }

      @media (prefers-color-scheme: dark) {
        .settings-modal {
          background: rgba(15, 23, 42, 0.96);
          color: rgba(226, 232, 240, 0.92);
        }
      }

      .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .settings-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }

      .settings-field input {
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        padding: 8px;
        font-size: 14px;
        background: rgba(226, 232, 240, 0.6);
        color: inherit;
      }

      @media (prefers-color-scheme: dark) {
        .settings-field input {
          background: rgba(30, 41, 59, 0.65);
        }
      }

      .settings-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .settings-message {
        font-size: 12px;
        min-height: 16px;
        color: rgba(71, 85, 105, 0.9);
      }

      .settings-message.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <header class="popup-header">
      <h1>Browser MCP</h1>
      <button id="openSettingsButton" class="icon-button" type="button" aria-label="Open settings">⚙️</button>
    </header>

    <section class="card">
      <div class="status-row">
        <span id="bridgeStatusSpinner" class="status-spinner" hidden aria-hidden="true"></span>
        <span id="bridgeStatusLabel">Disconnected</span>
      </div>
      <div id="bridgeStatusError" class="status-error"></div>
      <button id="bridgeToggleBtn" class="primary-button" type="button">Connect</button>
    </section>

    <section class="card">
      <div id="tabStatusText" class="tab-status">Current tab: Not active for browser use.</div>
      <div id="tabActions" class="tab-actions"></div>
      <div id="tabMessage" class="tab-message"></div>
    </section>

    <div id="settingsOverlay" class="settings-overlay" hidden>
      <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-header">
          <h2 id="settingsTitle" style="font-size: 15px; margin: 0;">Settings</h2>
          <button id="settingsCloseButton" class="icon-button" type="button" aria-label="Close settings">✕</button>
        </div>
        <label class="settings-field" for="settingsPortInput">
          <span>Bridge port</span>
          <input id="settingsPortInput" type="number" min="1" max="65535" />
        </label>
        <div class="settings-actions">
          <button id="settingsCancelButton" type="button">Cancel</button>
          <button id="settingsSaveButton" class="primary-button" type="button">Save</button>
        </div>
        <div id="settingsMessage" class="settings-message"></div>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
